<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact · OMEGA AUTO</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
<style>
body { background:#f5f7fa; font-family:'Segoe UI',sans-serif; padding-bottom:70px; }
.topnav { background:#0a2540; color:#fff; padding:12px 16px; display:flex; align-items:center; gap:10px; }
.topnav a { color:#fff; text-decoration:none; font-size:18px; }
.topnav h2 { font-size:16px; margin:0; flex:1; font-weight:700; }
.ag-card { background:#fff; border-radius:14px; padding:16px; margin:0 16px 12px; box-shadow:0 2px 12px rgba(10,37,64,.06); }
.btn-wa-sm { background:#25D366; color:#fff; padding:8px 14px; border-radius:10px; text-decoration:none; font-size:13px; font-weight:600; }
.bottom-nav { position:fixed; bottom:0; left:0; right:0; background:#fff; display:flex; justify-content:space-around; padding:10px 0; border-top:1px solid #eee; z-index:100; }
.bottom-nav a { color:#8896aa; text-decoration:none; font-size:11px; text-align:center; flex:1; }
.bottom-nav a.active { color:#ff6b35; }
.bottom-nav i { font-size:22px; display:block; margin-bottom:2px; }
</style>
</head>
<body>
<div class="topnav">
  <a href="{{ url_for('mobile_home') }}"><i class="bi bi-arrow-left"></i></a>
  <h2>Nos agences</h2>
</div>

<div style="height:16px"></div>
{% for a in agences %}
<div class="ag-card">
  <div style="font-weight:700;color:#0a2540">{{ a.nom }}</div>
  <div class="text-muted" style="font-size:12px">{{ a.type or '' }}</div>
  <hr style="margin:10px 0">
  <div style="font-size:13px">
    <div>📍 {{ a.adresse or '—' }}, {{ a.ville or '' }}</div>
    <div>📞 {{ a.telephone or '—' }}</div>
    <div>🕐 {{ a.horaires or '—' }}</div>
  </div>
  <div class="mt-3 d-flex gap-2">
    <a href="tel:{{ a.telephone }}" class="btn btn-sm btn-light"><i class="bi bi-telephone"></i> Appeler</a>
    <a href="https://wa.me/{{ (a.whatsapp or a.telephone or '221770000000')|replace(' ','')|replace('+','') }}" target="_blank" class="btn-wa-sm"><i class="bi bi-whatsapp"></i> WhatsApp</a>
  </div>
</div>
{% endfor %}

<nav class="bottom-nav">
  <a href="{{ url_for('mobile_home') }}"><i class="bi bi-house-door-fill"></i>Accueil</a>
  <a href="{{ url_for('mobile_catalogue') }}"><i class="bi bi-grid"></i>Catalogue</a>
  <a href="{{ url_for('mobile_suivi') }}"><i class="bi bi-search-heart"></i>Suivi</a>
  <a href="{{ url_for('mobile_contact') }}" class="active"><i class="bi bi-telephone-fill"></i>Contact</a>
</nav>
</body>
</html>

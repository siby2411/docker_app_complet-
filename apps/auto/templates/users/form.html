{% extends "base.html" %}
{% block title %}{{ 'Modifier' if user else 'Nouvel' }} utilisateur{% endblock %}
{% block page_title %}{{ '✏️ Modifier' if user else '➕ Nouvel' }} utilisateur{% endblock %}
{% block content %}
<form method="POST" class="card-premium">
  <div class="row g-3">
    <div class="col-md-4"><label class="form-label">Username *</label><input type="text" name="username" class="form-control" required value="{{ user.username if user else '' }}"></div>
    <div class="col-md-4"><label class="form-label">Mot de passe {{ '(laisser vide pour ne pas changer)' if user else '*' }}</label><input type="password" name="password" class="form-control" {% if not user %}required{% endif %}></div>
    <div class="col-md-4"><label class="form-label">Rôle *</label>
      <select name="role" class="form-select">
        {% for r in ['admin','directeur','commercial','caissier'] %}<option value="{{ r }}" {% if user and user.role==r %}selected{% endif %}>{{ r }}</option>{% endfor %}
      </select>
    </div>
    <div class="col-md-6"><label class="form-label">Nom complet</label><input type="text" name="nom_complet" class="form-control" value="{{ user.nom_complet if user else '' }}"></div>
    <div class="col-md-6"><label class="form-label">Email</label><input type="email" name="email" class="form-control" value="{{ user.email if user else '' }}"></div>
    <div class="col-md-4"><label class="form-label">Téléphone</label><input type="text" name="telephone" class="form-control" value="{{ user.telephone if user else '' }}"></div>
    <div class="col-md-4"><label class="form-label">WhatsApp</label><input type="text" name="whatsapp" class="form-control" value="{{ user.whatsapp if user else '' }}"></div>
    <div class="col-md-4"><label class="form-label">Agence</label><input type="text" name="agence" class="form-control" value="{{ user.agence if user else '' }}"></div>
    {% if user %}
    <div class="col-12"><div class="form-check form-switch">
      <input class="form-check-input" type="checkbox" name="actif" id="actif" {% if user.actif %}checked{% endif %}>
      <label class="form-check-label" for="actif">Compte actif</label>
    </div></div>
    {% endif %}
  </div>
  <div class="mt-4 d-flex gap-2">
    <button class="btn btn-accent"><i class="bi bi-check-lg"></i> Enregistrer</button>
    <a href="{{ url_for('users_list') }}" class="btn btn-light">Annuler</a>
  </div>
</form>
{% endblock %}

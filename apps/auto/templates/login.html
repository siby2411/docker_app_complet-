<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Connexion · OMEGA AUTO</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
<style>
body {
  min-height: 100vh; margin: 0;
  background: linear-gradient(135deg, #0a2540 0%, #1a1a2e 100%);
  display: flex; align-items: center; justify-content: center;
  font-family: 'Segoe UI', sans-serif;
}
.login-card {
  background: #fff; border-radius: 24px; padding: 48px 40px;
  width: 100%; max-width: 440px;
  box-shadow: 0 24px 64px rgba(0,0,0,.4);
}
.login-card .logo {
  text-align: center; margin-bottom: 32px;
}
.login-card .logo h1 {
  font-size: 32px; font-weight: 900; margin: 0;
  background: linear-gradient(135deg, #0a2540, #ff6b35);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: 2px;
}
.login-card .logo p { color: #8896aa; font-size: 13px; letter-spacing: 3px; margin: 8px 0 0; }
.form-floating { margin-bottom: 16px; }
.form-floating input { border-radius: 12px; border: 2px solid #e0e6ed; padding-left: 44px; }
.form-floating input:focus { border-color: #ff6b35; box-shadow: 0 0 0 4px rgba(255,107,53,.15); }
.form-floating label { padding-left: 44px; color: #8896aa; }
.input-icon {
  position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
  color: #8896aa; z-index: 5;
}
.btn-login {
  width: 100%; padding: 14px; border: none; border-radius: 12px;
  background: linear-gradient(135deg, #ff6b35, #ff8e5e);
  color: #fff; font-weight: 700; letter-spacing: 1px;
  transition: all .3s;
}
.btn-login:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(255,107,53,.4); }
.credits { text-align: center; margin-top: 24px; color: #8896aa; font-size: 12px; }
.credits code { background: #f5f7fa; padding: 2px 6px; border-radius: 4px; color: #0a2540; }
</style>
</head>
<body>
<div class="login-card">
  <div class="logo">
    <h1>🚗 OMEGA AUTO</h1>
    <p>GESTION PARC AUTOMOBILE</p>
  </div>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
    <div class="alert alert-{{ 'success' if cat=='success' else 'danger' }}">{{ msg }}</div>
    {% endfor %}
  {% endwith %}

  <form method="POST">
    <div class="form-floating position-relative">
      <i class="bi bi-person-fill input-icon"></i>
      <input type="text" class="form-control" id="username" name="username" placeholder="Utilisateur" required autofocus>
      <label for="username">Nom d'utilisateur</label>
    </div>
    <div class="form-floating position-relative">
      <i class="bi bi-lock-fill input-icon"></i>
      <input type="password" class="form-control" id="password" name="password" placeholder="Mot de passe" required>
      <label for="password">Mot de passe</label>
    </div>
    <button type="submit" class="btn-login mt-3">
      <i class="bi bi-box-arrow-in-right"></i> SE CONNECTER
    </button>
  </form>

  <div class="credits">
    Démo : <code>admin</code> / <code>admin123</code>
  </div>
</div>
</body>
</html>

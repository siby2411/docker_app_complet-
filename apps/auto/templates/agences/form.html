{% extends "base.html" %}
{% block title %}{{ 'Modifier' if agence else 'Nouvelle' }} agence{% endblock %}
{% block page_title %}{{ '✏️ Modifier' if agence else '➕ Nouvelle' }} agence{% endblock %}
{% block content %}
<form method="POST" class="card-premium">
  <div class="row g-3">
    <div class="col-md-6"><label class="form-label">Nom *</label><input type="text" name="nom" class="form-control" required value="{{ agence.nom if agence else '' }}"></div>
    <div class="col-md-3"><label class="form-label">Type</label>
      <select name="type" class="form-select">
        {% for t in ['concession','agence','succursale','dépôt'] %}
        <option value="{{ t }}" {% if agence and agence.type==t %}selected{% endif %}>{{ t|capitalize }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-md-3"><label class="form-label">Statut</label>
      <select name="statut" class="form-select">
        <option value="actif" {% if agence and agence.statut=='actif' %}selected{% endif %}>Actif</option>
        <option value="inactif" {% if agence and agence.statut=='inactif' %}selected{% endif %}>Inactif</option>
      </select>
    </div>
    <div class="col-md-8"><label class="form-label">Adresse</label><input type="text" name="adresse" class="form-control" value="{{ agence.adresse if agence else '' }}"></div>
    <div class="col-md-4"><label class="form-label">Ville</label><input type="text" name="ville" class="form-control" value="{{ agence.ville if agence else '' }}"></div>
    <div class="col-md-4"><label class="form-label">Région</label><input type="text" name="region" class="form-control" value="{{ agence.region if agence else '' }}"></div>
    <div class="col-md-4"><label class="form-label">Pays</label><input type="text" name="pays" class="form-control" value="{{ agence.pays if agence else 'Sénégal' }}"></div>
    <div class="col-md-4"><label class="form-label">Responsable</label><input type="text" name="responsable" class="form-control" value="{{ agence.responsable if agence else '' }}"></div>
    <div class="col-md-4"><label class="form-label">Téléphone</label><input type="text" name="telephone" class="form-control" value="{{ agence.telephone if agence else '' }}"></div>
    <div class="col-md-4"><label class="form-label">WhatsApp</label><input type="text" name="whatsapp" class="form-control" value="{{ agence.whatsapp if agence else '' }}"></div>
    <div class="col-md-4"><label class="form-label">Email</label><input type="email" name="email" class="form-control" value="{{ agence.email if agence else '' }}"></div>
    <div class="col-md-4"><label class="form-label">Horaires</label><input type="text" name="horaires" class="form-control" value="{{ agence.horaires if agence else 'Lun-Sam 8h-19h' }}"></div>
    <div class="col-md-2"><label class="form-label">Latitude</label><input type="number" step="any" name="latitude" class="form-control" value="{{ agence.latitude if agence else 0 }}"></div>
    <div class="col-md-2"><label class="form-label">Longitude</label><input type="number" step="any" name="longitude" class="form-control" value="{{ agence.longitude if agence else 0 }}"></div>
  </div>
  <div class="mt-4 d-flex gap-2">
    <button class="btn btn-accent"><i class="bi bi-check-lg"></i> Enregistrer</button>
    <a href="{{ url_for('agences_list') }}" class="btn btn-light">Annuler</a>
    {% if agence %}
    <form method="POST" action="{{ url_for('agence_delete', aid=agence.id) }}" class="ms-auto" onsubmit="return confirm('Supprimer cette agence ?')">
      <button class="btn btn-outline-danger"><i class="bi bi-trash"></i> Supprimer</button>
    </form>
    {% endif %}
  </div>
</form>
{% endblock %}

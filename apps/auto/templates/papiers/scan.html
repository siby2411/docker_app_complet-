{% extends "base.html" %}
{% block title %}Scanner QR{% endblock %}
{% block page_title %}📸 Scanner un QR anti-fraude{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card-premium text-center">
      <h5>Scanner</h5>
      <p class="text-muted">Autorisez l'accès à la caméra.</p>
      <video id="video" style="width:100%;border-radius:12px;background:#000;max-height:400px" autoplay playsinline></video>
      <canvas id="canvas" style="display:none"></canvas>
      <div id="result" class="mt-3"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const resultDiv = document.getElementById('result');
let scanning = true;

navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
  .then(stream => { video.srcObject = stream; requestAnimationFrame(tick); })
  .catch(err => { resultDiv.innerHTML = '<div class="alert alert-danger">Impossible d\'accéder à la caméra : ' + err.message + '</div>'; });

function tick() {
  if (!scanning) return;
  if (video.readyState === video.HAVE_ENOUGH_DATA) {
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const code = jsQR(imageData.data, canvas.width, canvas.height);
    if (code && code.data) {
      scanning = false;
      fetch('{{ url_for("papier_scan_submit") }}', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ payload: code.data })
      })
      .then(r => r.json())
      .then(data => {
        resultDiv.innerHTML = `<div class="alert alert-${data.ok ? 'success' : 'danger'}">
          <strong>${data.message}</strong>
          ${data.data ? '<pre style="font-size:11px;margin-top:10px;white-space:pre-wrap">' + JSON.stringify(data.data, null, 2) + '</pre>' : ''}
        </div>
        <button class="btn btn-accent" onclick="location.reload()">Scanner à nouveau</button>`;
      });
      return;
    }
  }
  requestAnimationFrame(tick);
}
</script>
{% endblock %}

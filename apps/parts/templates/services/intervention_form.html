{% extends "base.html" %}
{% block title %}Nouvelle intervention{% endblock %}
{% block page_title %}➕ Nouvelle intervention{% endblock %}
{% block content %}
<form method="POST" class="card-premium">
  <div class="row g-3">
    <div class="col-md-6"><label class="form-label">Client *</label>
      <select name="client_id" class="form-select" required>
        <option value="">— Choisir —</option>
        {% for c in clients %}<option value="{{ c.id }}">{{ c.prenom or '' }} {{ c.nom }} — {{ c.telephone }}</option>{% endfor %}
      </select>
    </div>
    <div class="col-md-6"><label class="form-label">Service *</label>
      <select name="service_id" class="form-select" required>
        <option value="">— Choisir —</option>
        {% for s in services %}<option value="{{ s.id }}">{{ s.icone }} {{ s.nom }}</option>{% endfor %}
      </select>
    </div>
    <div class="col-md-3"><label class="form-label">Date</label>
      <input type="date" name="date_debut" class="form-control" value="{{ now.strftime('%Y-%m-%d') }}">
    </div>
    <div class="col-md-3"><label class="form-label">Kilométrage</label>
      <input type="number" name="kilometrage" class="form-control" value="0">
    </div>
    <div class="col-md-3"><label class="form-label">Priorité</label>
      <select name="priorite" class="form-select">
        <option value="normale">Normale</option>
        <option value="urgente">Urgente</option>
        <option value="basse">Basse</option>
      </select>
    </div>
    <div class="col-12"><label class="form-label">Description</label>
      <textarea name="description" class="form-control" rows="3"></textarea>
    </div>
  </div>
  <div class="mt-4 d-flex gap-2">
    <button class="btn btn-accent"><i class="bi bi-check-lg"></i> Créer</button>
    <a href="{{ url_for('interventions_list') }}" class="btn btn-light">Annuler</a>
  </div>
</form>
{% endblock %}

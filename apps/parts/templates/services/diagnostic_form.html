{% extends "base.html" %}
{% block title %}Nouveau diagnostic{% endblock %}
{% block page_title %}🔬 Nouveau diagnostic{% endblock %}
{% block content %}
<form method="POST" class="card-premium p-4">
  <div class="row g-3">
    <div class="col-md-6"><label class="form-label">🚗 Véhicule</label>
      <select name="vehicule_id" class="form-select">
        <option value="">— Choisir —</option>
        {% for v in vehicules %}
          <option value="{{ v.id }}">{{ v.immatriculation }} — {{ v.marque }} {{ v.modele }}</option>
        {% endfor %}
      </select></div>
    <div class="col-md-6"><label class="form-label">👤 Client</label>
      <select name="client_id" class="form-select">
        <option value="">— Aucun —</option>
        {% for c in clients %}
          <option value="{{ c.id }}">{{ c.prenom or '' }} {{ c.nom }} — {{ c.telephone }}</option>
        {% endfor %}
      </select></div>
    <div class="col-md-4"><label class="form-label">Type</label>
      <select name="type_diagnostic" class="form-select">
        <option value="moteur">Moteur</option>
        <option value="electricite">Électricité</option>
        <option value="electronique">Électronique</option>
        <option value="freinage">Freinage</option>
        <option value="suspension">Suspension</option>
        <option value="climatisation">Climatisation</option>
        <option value="general">Général</option>
      </select></div>
    <div class="col-md-4"><label class="form-label">Coût (FCFA)</label>
      <input type="number" step="0.01" name="cout" class="form-control" value="0"></div>
    <div class="col-md-12"><label class="form-label">Description du problème</label>
      <textarea name="description" class="form-control" rows="3"></textarea></div>
    <div class="col-md-12"><label class="form-label">Résultat du diagnostic</label>
      <textarea name="resultat" class="form-control" rows="3"></textarea></div>
  </div>
  <div class="mt-4 d-flex gap-2">
    <button class="btn btn-success">💾 Enregistrer</button>
    <a href="{{ url_for('diagnostic_list') }}" class="btn btn-secondary">Annuler</a>
  </div>
</form>
{% endblock %}

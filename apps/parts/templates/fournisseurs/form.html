{% extends "base.html" %}
{% block title %}{{ 'Modifier' if fournisseur else 'Nouveau' }} fournisseur{% endblock %}
{% block page_title %}{{ '✏️' if fournisseur else '➕' }} Fournisseur{% endblock %}
{% block content %}

<form method="POST" class="card-premium">
  <div class="row g-3">
    <div class="col-md-6"><label class="form-label">Nom *</label><input type="text" name="nom" class="form-control" required value="{{ fournisseur.nom if fournisseur else '' }}"></div>
    <div class="col-md-3"><label class="form-label">Type</label>
      <select name="type" class="form-select">
        {% for t in ['grossiste','importateur','fabricant','détaillant'] %}
        <option value="{{ t }}" {% if fournisseur and fournisseur.type==t %}selected{% endif %}>{{ t }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-md-3"><label class="form-label">Délai (jours)</label><input type="number" name="delai_livraison_jours" class="form-control" value="{{ fournisseur.delai_livraison_jours if fournisseur else 7 }}"></div>

    <div class="col-md-4"><label class="form-label">Pays</label><input type="text" name="pays" class="form-control" value="{{ fournisseur.pays if fournisseur else '' }}"></div>
    <div class="col-md-4"><label class="form-label">Ville</label><input type="text" name="ville" class="form-control" value="{{ fournisseur.ville if fournisseur else '' }}"></div>
    <div class="col-md-4"><label class="form-label">Contact</label><input type="text" name="contact_nom" class="form-control" value="{{ fournisseur.contact_nom if fournisseur else '' }}"></div>

    <div class="col-md-6"><label class="form-label">Adresse</label><input type="text" name="adresse" class="form-control" value="{{ fournisseur.adresse if fournisseur else '' }}"></div>
    <div class="col-md-3"><label class="form-label">Téléphone</label><input type="text" name="telephone" class="form-control" value="{{ fournisseur.telephone if fournisseur else '' }}"></div>
    <div class="col-md-3"><label class="form-label">WhatsApp</label><input type="text" name="whatsapp" class="form-control" value="{{ fournisseur.whatsapp if fournisseur else '' }}"></div>

    <div class="col-md-6"><label class="form-label">Email</label><input type="email" name="email" class="form-control" value="{{ fournisseur.email if fournisseur else '' }}"></div>
    <div class="col-md-3"><label class="form-label">Conditions paiement</label><input type="text" name="conditions_paiement" class="form-control" value="{{ fournisseur.conditions_paiement if fournisseur else '' }}"></div>
    <div class="col-md-3"><label class="form-label">Note (0-5)</label><input type="number" name="note" min="0" max="5" class="form-control" value="{{ fournisseur.note if fournisseur else 0 }}"></div>

    <div class="col-12">
      <div class="form-check form-switch">
        <input class="form-check-input" type="checkbox" name="actif" id="actif" {% if not fournisseur or fournisseur.actif %}checked{% endif %}>
        <label class="form-check-label" for="actif">Fournisseur actif</label>
      </div>
    </div>
  </div>

  <div class="mt-4 d-flex gap-2">
    <button class="btn btn-accent"><i class="bi bi-check-lg"></i> Enregistrer</button>
    <a href="{{ url_for('fournisseurs_list') }}" class="btn btn-light">Annuler</a>
  </div>
</form>

{% endblock %}

services:
  duckdns-updater:
    image: linuxserver/duckdns:latest
    container_name: docker2_duckdns
    restart: "no"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Africa/Dakar
      - SUBDOMAINS=omega-software
      - TOKEN=763c25e2-8d70-440a-9025-baf59381acf2

  nginx-proxy:
    image: nginx:latest
    container_name: docker2_nginx
    restart: "no"
    ports:
      - "8080:80"
      - "9443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./portal:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      - ecole
      - clinique
      - ecommerce
      - stock
      - commerciale
      - pointage
      - pos
      - auto

  ecole:
    build:
      context: ./apps/ecole
      dockerfile: Dockerfile
    container_name: docker2_ecole
    restart: "no"
    ports:
      - "9001:8000"
    volumes:
      - ./data/ecole:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

